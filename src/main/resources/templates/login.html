<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Login')}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>
<main>
    <h1>Login</h1>
    <p class="error" th:if="${param.error}">Invalid email or password.</p>
    <p class="success" th:if="${param.registered}">Account created. Log in.</p>
    <form class="card" th:action="@{/ui/login}" method="post">
        <label for="username">Email</label>
        <input id="username" name="username" type="email" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
        <div class="actions"><button type="submit">Login</button></div>
    </form>
    <p class="muted">No account yet? <a th:href="@{/ui/signup}">Sign up</a></p>
</main>
</body>
</html>
