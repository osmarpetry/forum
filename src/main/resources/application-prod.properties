# Profile for Docker (SPRING_PROFILES_ACTIVE=prod). Values here override application.properties.

# H2 file database in the /data volume, so data survives restarts
spring.datasource.url=jdbc:h2:file:/data/forum;NON_KEYWORDS=USER
# data.sql is idempotent; a file database is not "embedded", so run it always
spring.sql.init.mode=always
spring.h2.console.enabled=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false

# No fallback to the committed secret: start fails if FORUM_JWT_SECRET is not set
forum.jwt.secret=${FORUM_JWT_SECRET}

# Actuator on its own port. Compose does not publish it: only the admin container reaches it.
management.server.port=8082
spring.boot.admin.client.instance.management-base-url=http://forum:8082
